server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the api service (Docker Compose service
    # name "api", resolved via Docker's internal DNS) so the frontend can
    # keep calling relative "/api/..." paths exactly as it does in local
    # dev (where Vite's dev-server proxy does the same job).
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: any other route serves index.html so client-side
    # routing (none currently, but harmless) doesn't 404 on refresh.
    location / {
        try_files $uri /index.html;
    }
}
