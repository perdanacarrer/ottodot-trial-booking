services:
  api:
    build:
      context: ./apps/api
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: file:/app/data/dev.db
      PORT: "4000"
    volumes:
      # Named volume so the SQLite file survives `docker compose down` /
      # container restarts. Remove the volume (see README) to start fresh.
      - api_data:/app/data

  web:
    build:
      context: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  api_data:
